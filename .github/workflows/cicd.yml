name: Build and Deploy

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}/discord-extension

      - name: Build and Push
        uses: docker/build-push-action@v7
        with:
          context: extensions/discord
          target: production
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  deploy-server:
    runs-on: ubuntu-latest
    needs:
      - build
    steps:
      - name: Trigger Webhooks
        env:
          WEBHOOK_URLS: ${{ secrets.WEBHOOK_URLS }}
        run: |
          jq -r '.[]' <<< "$WEBHOOK_URLS" | while IFS= read -r url; do
            curl --fail-with-body --silent --show-error --request POST \
              --header 'Content-Type: application/json' "$url"
          done

  deploy-functions:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    needs:
      - build
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Build deployment image
        run: docker build --target deploy --tag onair-hooks-deploy extensions/discord

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ap-northeast-1

      - name: Environment Variables
        run: |
          {
            echo "S3_BUCKET=${{ secrets.S3_BUCKET }}"
            echo "S3_PREFIX=${{ secrets.S3_PREFIX }}"
            echo "SUBNET_IDS=${{ secrets.SUBNET_IDS }}"
            echo "SECURITY_GROUP_IDS=${{ secrets.SECURITY_GROUP_IDS }}"
            echo "OPENAI_API_KEY=${{ secrets.OPENAI_API_KEY }}"
            echo "REDIS_HOST=${{ secrets.REDIS_HOST }}"
            echo "AWS_REGION=ap-northeast-1"
          } > .env

      - name: Build and Deploy
        run: |
          docker run --rm --env-file .env \
            --env AWS_ACCESS_KEY_ID \
            --env AWS_SECRET_ACCESS_KEY \
            --env AWS_SESSION_TOKEN \
            onair-hooks-deploy
